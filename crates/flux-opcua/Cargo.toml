[package]
name = "flux-opcua"
version = "0.1.0"
edition = "2021"
authors = ["FLUX IOT Team"]
description = "OPC UA protocol implementation for FLUX IOT platform"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
opcua = { version = "0.12", features = ["client"] }
parking_lot = "0.12"
uuid = { version = "1.0", features = ["v4"] }
rand = "0.8"
chrono = "0.4"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
base64 = "0.21"

# Workspace dependencies
flux-protocol = { path = "../flux-protocol" }
flux-core = { path = "../flux-core" }
flux-types = { path = "../flux-types" }

[dev-dependencies]
tracing-subscriber = "0.3"
