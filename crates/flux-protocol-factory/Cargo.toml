[package]
name = "flux-protocol-factory"
version = "0.1.0"
edition = "2021"
authors = ["FLUX IOT Team"]
description = "Protocol factory implementation for FLUX IOT platform"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"

# Workspace dependencies
flux-protocol = { path = "../flux-protocol" }
flux-modbus = { path = "../flux-modbus", optional = true }
flux-coap = { path = "../flux-coap", optional = true }
flux-opcua = { path = "../flux-opcua", optional = true }

[features]
default = ["modbus", "coap", "opcua"]
modbus = ["flux-modbus"]
coap = ["flux-coap"]
opcua = ["flux-opcua"]

[dev-dependencies]
tokio-test = "0.4"
